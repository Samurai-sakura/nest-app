services:
  postgres:
    image: postgres:17-alpine
    container_name: backend-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-backend_app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: backend-app-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: backend-app-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-BACKENDAPPDEV}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-BACKENDAPPDEVSECRET2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
